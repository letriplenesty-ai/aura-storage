name: Validate storage configuration

on:
  push:
    branches: [main, "feat/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main, feat/secure-storage-pilot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/generate-config.sh
          bash -n scripts/deploy.sh
          bash -n scripts/healthcheck.sh
          bash -n tests/sse-s3-smoke-test.sh
          bash -n tests/s3-smoke-test.sh
          bash -n tests/test-s3-smoke-validation.sh
          bash -n scripts/backup-lib.sh scripts/backup.sh scripts/restore-check.sh scripts/restore.sh
          bash -n tests/test-backup-scripts.sh
          bash -n scripts/host-preflight.sh scripts/install-admin-key.sh tests/test-landing-routing.sh
      - name: Run offline regression tests
        run: |
          bash tests/test-s3-smoke-validation.sh
          bash tests/test-landing-routing.sh
      - name: Run offline backup script checks
        run: bash tests/test-backup-scripts.sh
      - name: Check sample backup configuration is ignored
        run: git check-ignore config/backup.env
      - name: Run API unit tests (offline)
        run: |
          python3 -m pip install -r api/requirements-dev.txt
          AURA_API_ADMIN_PASSWORD=ci-dummy-password AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 AURA_S3_ENDPOINT=https://127.0.0.1:9 AURA_API_DB=:memory: AURA_COOKIE_SECURE=0 python3 -m pytest tests/ -q
      - name: Check sample S3 JSON
        run: python3 -m json.tool config/seaweedfs/s3.json.example >/dev/null
      - name: Prepare disposable validation environment
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          p = Path(".env")
          s = p.read_text()
          s = s.replace("REPLACE_WITH_GENERATED_ACCESS_KEY", secrets.token_hex(12))
          s = s.replace("REPLACE_WITH_GENERATED_LONG_RANDOM_SECRET", secrets.token_hex(32))
          s = s.replace("REPLACE_WITH_64_HEX_CHARACTERS", secrets.token_hex(32))
          # Dummy dashboard identity for config validation only (never deployed).
          s += "DASHBOARD_AUTH='ci-dummy:dummy'\n"
          p.write_text(s)
          PY
          chmod 600 .env
      - name: Generate ignored S3 config
        run: bash scripts/generate-config.sh
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Confirm secrets are ignored
        run: git check-ignore .env config/seaweedfs/s3.json

  api-postgres:
    # The default job runs the API suite on SQLite; production uses PostgreSQL.
    # Run the same suite against the pinned PostgreSQL major, plus the PG-only
    # parity tests (AURA_TEST_PG_DSN).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: ci-dummy-pg-password
          POSTGRES_DB: aura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aura -d aura" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create the parity-test database
        run: PGPASSWORD=ci-dummy-pg-password psql -h 127.0.0.1 -U aura -d aura -c "CREATE DATABASE aura_parity"
      - name: Run API tests on PostgreSQL
        run: |
          python3 -m pip install -r api/requirements-dev.txt
          AURA_API_BACKEND=postgres \
          AURA_API_DSN=postgresql://aura:ci-dummy-pg-password@127.0.0.1:5432/aura \
          AURA_TEST_PG_DSN=postgresql://aura:ci-dummy-pg-password@127.0.0.1:5432/aura_parity \
          AURA_API_ADMIN_PASSWORD=ci-dummy-password AURA_S3_ACCESS_KEY=ci-dummy-access-key-1234 \
          AURA_S3_SECRET_KEY=ci-dummy-secret-12345678901234567890 AURA_S3_ENDPOINT=https://127.0.0.1:9 \
          AURA_COOKIE_SECURE=0 python3 -m pytest tests/ -q
