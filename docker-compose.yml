name: aura-storage

services:
  traefik:
    image: ${TRAEFIK_IMAGE:?Set TRAEFIK_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aura-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Uploads are direct presigned PUTs whose entire body is one request. The
      # Traefik default readTimeout (60s) cut large uploads mid-body -> HTTP 502
      # and the UI reported "Réseau interrompu.". 1200s is bounded (slowloris
      # protection stays), yet covers the 900s presigned-URL/intent TTL.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1200s
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=INFO
      - --ping=true
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The Traefik dashboard (api@internal) IS routed on DASHBOARD_DOMAIN over
    # HTTPS, protected by the `dash-auth` BasicAuth middleware (bcrypt). Port
    # 8080 is never published; access requires the DASHBOARD_AUTH credentials.
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.traefik-dashboard.rule=Host(`${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=dash-ipallow,dash-auth
      - traefik.http.middlewares.dash-auth.basicauth.users=${DASHBOARD_AUTH:?Set DASHBOARD_AUTH in .env}
      # Source allow-list in front of BasicAuth. The default admits loopback only,
      # i.e. the dashboard is closed until DASHBOARD_ALLOWED_IPS names the
      # operator VPN / admin addresses (comma-separated IPs or CIDRs).
      - traefik.http.middlewares.dash-ipallow.ipallowlist.sourcerange=${DASHBOARD_ALLOWED_IPS:-127.0.0.1/32}
      # HSTS for every public router (app, S3, landing). Declared here because
      # Traefik is the single TLS terminator; one year, subdomains included.
      - traefik.http.middlewares.aura-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.aura-hsts.headers.stsIncludeSubdomains=true
      # Port 8080 is never published to the host; the dashboard is reachable only
      # through this HTTPS router with BasicAuth (bcrypt).

  seaweed-master:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-master
    restart: unless-stopped
    command:
      - master
      - -ip=seaweed-master
      - -ip.bind=0.0.0.0
      - -mdir=/data
      - -volumeSizeLimitMB=${SEAWEED_VOLUME_SIZE_LIMIT_MB:-30000}
    volumes:
      - ${AURA_DATA_DIR:-./data}/master:/data
    networks:
      - storage
    security_opt:
      - no-new-privileges:true

  seaweed-volume:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-volume
    restart: unless-stopped
    command:
      - volume
      - -master=seaweed-master:9333
      - -ip=seaweed-volume
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -port=8080
      - -max=${SEAWEED_VOLUME_MAX:-0}
    volumes:
      - ${AURA_DATA_DIR:-./data}/volume:/data
    networks:
      - storage
    depends_on:
      seaweed-master:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  seaweed-filer:
    image: ${SEAWEEDFS_IMAGE:?Set SEAWEEDFS_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-filer
    restart: unless-stopped
    command:
      - filer
      - -master=seaweed-master:9333
      - -ip=seaweed-filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      # Restrict the CORS fallback rule to the app origin instead of the
      # SeaweedFS default "*". AllowedHeaders stays "*" so the preflight for the
      # signed `x-amz-server-side-encryption` header on presigned PUTs is echoed.
      - -s3.allowedOrigins=https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      # SeaweedFS SSE-S3 envelope-encryption key. Keep identical across all S3 gateways.
      WEED_S3_SSE_KEK: ${WEED_S3_SSE_KEK:?Set a 64-character hex WEED_S3_SSE_KEK in .env}
    volumes:
      - ${AURA_DATA_DIR:-./data}/filer:/data
      - ./config/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - storage
      - edge
    depends_on:
      seaweed-master:
        condition: service_started
      seaweed-volume:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.aura-s3.rule=Host(`${S3_DOMAIN:?Set S3_DOMAIN in .env}`)
      - traefik.http.routers.aura-s3.entrypoints=websecure
      - traefik.http.routers.aura-s3.tls=true
      - traefik.http.routers.aura-s3.tls.certresolver=le
      - traefik.http.routers.aura-s3.middlewares=aura-hsts@docker
      - traefik.http.services.aura-s3.loadbalancer.server.port=8333
    security_opt:
      - no-new-privileges:true
    # No SeaweedFS master/volume/filer admin ports are published to the host.

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    container_name: ${AURA_INSTANCE_ID:-aura-001}-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - storage
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aura} -d $${POSTGRES_DB:-aura}"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No host ports published: catalogue DB reachable only on the internal network.

  api:
    build: ./api
    image: aura-api:local
    container_name: ${AURA_INSTANCE_ID:-aura-001}-api
    restart: unless-stopped
    # Least privilege: pass only the variables the API actually reads
    # (api/config.py), instead of `env_file: .env` which injected every .env
    # value — including WEED_S3_SSE_KEK, CLOUDFLARE_API_TOKEN, DASHBOARD_AUTH and
    # POSTGRES_PASSWORD — into this network-exposed container. Each entry stays
    # overridable from the operator's .env; the defaults below mirror
    # api/config.py exactly, so an unset .env keeps today's behaviour identical.
    environment:
      TZ: ${TZ:-Africa/Porto-Novo}
      AURA_API_ADMIN_USER: ${AURA_API_ADMIN_USER:-admin}
      AURA_API_ADMIN_PASSWORD: ${AURA_API_ADMIN_PASSWORD:?Set AURA_API_ADMIN_PASSWORD in .env}
      AURA_S3_ENDPOINT: https://${S3_DOMAIN:?Set S3_DOMAIN in .env}
      AURA_S3_INTERNAL_ENDPOINT: http://seaweed-filer:8333
      AURA_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AURA_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      AURA_S3_REGION: ${AURA_S3_REGION:-us-east-1}
      AURA_API_BACKEND: postgres
      AURA_API_DSN: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aura}
      AURA_COOKIE_SECURE: "1"
      # Human session cookie lifetime (seconds): 90 days. Pinned here so the
      # deployed stack matches the documented default (api/config.py). Override
      # in .env only deliberately; the expiry is fixed at login (no renewal).
      AURA_SESSION_TTL: "7776000"
      # Audit trail on a named volume: it must survive image rebuilds and
      # container recreation (the default path is inside the container).
      AURA_AUDIT_LOG: /var/lib/aura/audit/aura-audit.jsonl
      # Multipart upload (#72): off until the compatibility gate in
      # docs/MULTIPART-UPLOAD-PLAN.md passes on the pinned SeaweedFS image.
      AURA_MULTIPART_ENABLED: ${AURA_MULTIPART_ENABLED:-0}
      AURA_MULTIPART_THRESHOLD_BYTES: ${AURA_MULTIPART_THRESHOLD_BYTES:-104857600}
      AURA_MULTIPART_PART_BYTES: ${AURA_MULTIPART_PART_BYTES:-16777216}
      AURA_MULTIPART_MAX_OBJECT_BYTES: ${AURA_MULTIPART_MAX_OBJECT_BYTES:-1099511627776}
      AURA_MULTIPART_SESSION_TTL: ${AURA_MULTIPART_SESSION_TTL:-604800}
      # Asynchronous integrity check (N5): objects at or above the threshold are
      # hashed by a worker thread in this container, outside the commit request.
      AURA_VERIFY_ASYNC_THRESHOLD_BYTES: ${AURA_VERIFY_ASYNC_THRESHOLD_BYTES:-268435456}
      AURA_VERIFY_WORKER: ${AURA_VERIFY_WORKER:-inline}
      # Capacity guard: usable object-store bytes (0 = off) and the fill level
      # (%) above which new uploads are refused with 507.
      AURA_STORAGE_CAPACITY_BYTES: ${AURA_STORAGE_CAPACITY_BYTES:-0}
      AURA_STORAGE_HIGH_WATERMARK: ${AURA_STORAGE_HIGH_WATERMARK:-90}
      # Periodic integrity scrub (api/scrubber.py): read-only re-hash of stored
      # objects, at least once per interval, within a byte budget per hour.
      AURA_SCRUB_ENABLED: ${AURA_SCRUB_ENABLED:-1}
      AURA_SCRUB_INTERVAL_DAYS: ${AURA_SCRUB_INTERVAL_DAYS:-30}
      AURA_SCRUB_BYTES_PER_RUN: ${AURA_SCRUB_BYTES_PER_RUN:-10737418240}
      # Storage orphans: bytes younger than this are never reported or removed.
      AURA_ORPHAN_GRACE_SECONDS: ${AURA_ORPHAN_GRACE_SECONDS:-86400}
      # No origin/CORS allow-list here on purpose: the api has no Traefik route
      # and is reached same-origin through the app proxy (app/nginx.conf proxies
      # /api/ to this service). Browser uploads go straight to SeaweedFS via
      # presigned URLs, so any CORS belongs to the SeaweedFS S3 gateway.
    volumes:
      - audit-log:/var/lib/aura/audit
    networks:
      - storage
    depends_on:
      postgres:
        condition: service_healthy
      seaweed-filer:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    # No host ports, no Traefik route: reachable only via the app proxy.

  app:
    image: nginx:1.28.3-alpine
    container_name: ${AURA_INSTANCE_ID:-aura-001}-app
    restart: unless-stopped
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      # Rendered by the nginx image's envsubst step into conf.d/default.conf, so
      # the CSP can name the S3 host that receives direct presigned uploads.
      - ./app/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      S3_DOMAIN: ${S3_DOMAIN:?Set S3_DOMAIN in .env}
    networks:
      - storage
      - edge
    depends_on:
      api:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.aura-app.rule=Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)
      - traefik.http.routers.aura-app.entrypoints=websecure
      - traefik.http.routers.aura-app.tls=true
      - traefik.http.routers.aura-app.tls.certresolver=le
      - traefik.http.routers.aura-app.middlewares=aura-hsts@docker
      - traefik.http.services.aura-app.loadbalancer.server.port=80
      # No path prefix, no strip: the app is served from the domain root.
      # The S3 API keeps exclusive use of aura-storage.eurinhash.com.
    security_opt:
      - no-new-privileges:true
    # Only 80/443 via Traefik (shared entrypoints); no direct ports published.

  # Landing page answering the S3 root for humans: a browser opening S3_DOMAIN
  # without signing gets an explanation and a link to the app instead of raw XML.
  # The router matches ONLY an unsigned GET on `/`; every signed or non-root
  # request keeps going to SeaweedFS through the `aura-s3` router.
  s3-landing:
    image: nginx:1.28.3-alpine
    container_name: ${AURA_INSTANCE_ID:-aura-001}-s3-landing
    restart: unless-stopped
    environment:
      S3_DOMAIN: ${S3_DOMAIN:?Set S3_DOMAIN in .env}
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    command: ["/bin/sh", "/opt/aura-landing/entrypoint.sh"]
    volumes:
      - ./landing:/opt/aura-landing:ro
      - ./web/dist/fonts:/opt/aura-landing-fonts:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=aura-edge
      - traefik.http.routers.aura-s3-landing.rule=Host(`${S3_DOMAIN:?Set S3_DOMAIN in .env}`) && Path(`/`) && Method(`GET`) && !HeaderRegexp(`Authorization`, `.+`)
      # Explicit priority: the landing rule is longer than the S3 rule, but the
      # intent must not depend on rule-length sorting.
      - traefik.http.routers.aura-s3-landing.priority=1000
      - traefik.http.routers.aura-s3-landing.entrypoints=websecure
      - traefik.http.routers.aura-s3-landing.tls=true
      - traefik.http.routers.aura-s3-landing.tls.certresolver=le
      - traefik.http.routers.aura-s3-landing.middlewares=aura-hsts@docker
      - traefik.http.services.aura-s3-landing.loadbalancer.server.port=80
    security_opt:
      - no-new-privileges:true
    # No host ports, no access to the internal storage network.

networks:
  edge:
    name: aura-edge
  storage:
    name: aura-storage-internal
    internal: true

volumes:
  traefik-acme:
  pgdata:
  audit-log:
