openapi: 3.1.0
info:
  title: AURA Management API
  version: 0.2.0
  description: |
    Implemented contract for the AURA Management API (`api/main.py`). Bytes never
    pass through the API: clients upload/download directly to S3 through short-lived
    presigned URLs. Object keys and buckets are chosen server-side.

    Human callers authenticate with the `aura_session` cookie; mutating calls must
    also send the session CSRF token in `X-CSRF-Token`. Machine callers authenticate
    with a Bearer service-identity token. Authorization is server-side and default-deny;
    see `docs/AUTHORIZATION-MATRIX.md`.

    Identifiers are canonical UUID v4 values (`docs/DATA-MODEL.md`); a malformed
    identifier in a path, query parameter or request body is refused with 422.

    Validated locally (offline tests) and by CI; not yet validated on the pilot VPS.
servers:
  - url: https://app.aura-storage.eurinhash.com
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /health/live:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Dependencies ready }
        "503": { description: Not ready }
  /api/v1/login:
    post:
      summary: Create a human session (public, rate-limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: Returns the CSRF token; sets the session cookie }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }
  /api/v1/logout:
    post:
      summary: Delete the current session (human only)
      responses:
        "200": { description: Logged out }
        "401": { description: Authentication required }
        "403": { description: CSRF validation failed }
  /api/v1/me:
    get:
      summary: Introspect the current principal
      responses:
        "200":
          description: >-
            Principal metadata (kind, role, scopes, space, application). For a
            human session, `csrf_token` re-exposes the token issued at login so
            the client can recover it after a refresh without a new login; it is
            always `null` for service (Bearer) principals.
        "401": { description: Authentication required }
  /api/v1/objects:
    get:
      summary: List objects visible to the caller
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Negative values are clamped to 0 (never 422)
        - in: query
          name: folder_id
          schema: { type: string }
          description: >-
            Optional catalogue filter (#62): the literal "root" returns objects
            not filed in any folder; a canonical uuid returns that folder's
            objects. A malformed value is refused with 422.
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
          description: >-
            Case-insensitive display-name substring (M02). Never matches the
            internal object key; a blank value is ignored.
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, verifying, available, deleted, expired, failed, aborted, purging]
          description: Exact catalogue status.
        - in: query
          name: content_type
          schema: { type: string, maxLength: 127 }
          description: Exact media type, compared case-insensitively.
        - in: query
          name: min_size
          schema: { type: integer, minimum: 0 }
          description: Minimum committed size in bytes (pending rows still carry size -1).
        - in: query
          name: max_size
          schema: { type: integer, minimum: 0 }
          description: Maximum committed size in bytes.
        - in: query
          name: created_after
          schema: { type: integer, minimum: 0 }
          description: Inclusive lower bound on creation time (epoch seconds).
        - in: query
          name: created_before
          schema: { type: integer, minimum: 0 }
          description: Inclusive upper bound on creation time (epoch seconds).
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at, display_name, size_bytes]
            default: created_at
          description: Sort key; ties break on id so OFFSET paging stays stable.
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
      responses:
        "200":
          description: >-
            Page of object metadata. Each item carries folder_id, created_at and
            updated_at; internal storage coordinates (bucket, object_key) are
            never returned. Soft-deleted rows are hidden unless status=deleted
            is passed explicitly.
        "401": { description: Authentication required }
        "403": { description: Access denied }
        "422": { description: Malformed folder_id, or an unsupported status/sort/order value }
  /api/v1/objects/upload-intents:
    post:
      summary: Create a short-lived upload intent (capability objects:write)
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
          description: >-
            Optional opaque key. A repeated request carrying the same key and
            actor returns the same pending intent (idempotent_replay=true) with a
            freshly signed URL instead of creating a second object. Refused with
            422 if empty, over-long or containing control characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, size_bytes]
              properties:
                bucket: { type: string, maxLength: 63, description: Must be registered to the caller's space; omitted = space default }
                display_name: { type: string, minLength: 1, maxLength: 255 }
                content_type: { type: string, maxLength: 127, default: application/octet-stream, description: Normalized server-side; refused with 422 when the deployment sets an allow-list that excludes it }
                size_bytes: { type: integer, minimum: 0, description: "Declared upload size; bound into the presigned URL as a signed Content-Length and capped at the configured maximum object size. 0 is accepted only when empty objects are enabled." }
                folder_id: { $ref: "#/components/schemas/Uuid4", nullable: true }
      responses:
        "200": { description: "Upload intent (id, status, method, presigned upload_url, required headers, content_type, size_bytes, expiry). With AURA_MULTIPART_ENABLED=1 and a size at or above the threshold: upload_mode multipart, upload_url null and multipart {part_size_bytes, part_count}; parts are then requested from /multipart/parts" }
        "403": { description: Bucket not allowed / not authorised }
        "422": { description: Invalid request, disallowed content type, or empty/size over the cap }
        "507": { description: "Storage capacity reached: the declared size would pass AURA_STORAGE_HIGH_WATERMARK of AURA_STORAGE_CAPACITY_BYTES (only when a capacity is configured)" }
        "429": { description: Too many pending uploads }
  /api/v1/objects/{oid}/commit:
    post:
      summary: Validate an upload, stream SHA-256, mark available (objects:write)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object available with checksum_sha256 (algorithm sha256); idempotent on repeat }
        "202": { description: "Large object (>= AURA_VERIFY_ASYNC_THRESHOLD_BYTES): status verifying; a worker computes the SHA-256 and marks it available or failed. Follow GET /objects/{oid}. Idempotent on repeat" }
        "404": { description: Object not found or not visible }
        "409": { description: Object not committable (including aborted/expired/deleted), or multipart parts still missing }
        "410": { description: Upload intent expired }
        "502": { description: Storage could not assemble the multipart parts }
        "413": { description: Object exceeds the maximum allowed size }
        "422": { description: Upload missing or size mismatch }
  /api/v1/objects/{oid}/abort:
    post:
      summary: Cancel a pending upload intent (objects:write)
      description: >-
        Best-effort deletes the partial bytes and marks the intent aborted.
        Idempotent for an already aborted/expired intent; a committed (available)
        or deleted object is refused with 409. This is the only cancellation the
        UI uses — cancellation is not offered where the backend does not support it.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Intent aborted (or already in a terminal pending state) }
        "404": { description: Object not found or not visible }
        "409": { description: Object not abortable }
  /api/v1/objects/{oid}:
    get:
      summary: Get object metadata
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object metadata (size_bytes is -1 until verified; expected_size_bytes carries the declared size) }
        "404": { description: Object not found or not visible }
    patch:
      summary: File or unfile an object in a logical folder (objects:write, human only)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [folder_id]
              properties:
                folder_id: { $ref: "#/components/schemas/Uuid4", nullable: true, description: Folder owned by the caller; null unfiles the object (root level) }
      responses:
        "200": { description: Object metadata with its new folder_id }
        "404": { description: Object or target folder not found or not visible }
        "422": { description: No fields supplied, or malformed folder id }
    delete:
      summary: Soft-delete an object (objects:delete)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object marked deleted }
        "404": { description: Object not found or not visible }
        "409": { description: Object not deletable }
  /api/v1/objects/{oid}/download-intent:
    post:
      summary: Create a short-lived download intent (objects:read)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Presigned GET URL plus display_name, content_type, size_bytes and checksum_sha256 for progress/verification display }
        "404": { description: Object not found or not visible }
        "409": { description: Object not available }
  /api/v1/objects/{oid}/preview-intent:
    post:
      summary: Create a short-lived inline-preview intent (objects:read)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Presigned GET URL bound to Content-Disposition inline and the object content type, plus display_name, content_type and size_bytes }
        "404": { description: Object not found or not visible }
        "409": { description: Object not available }
        "415": { description: Content type is not on the inline allow-list (images except SVG, PDF, audio); offer a download instead }
  /api/v1/objects/{oid}/multipart:
    get:
      summary: Multipart plan and parts already held (objects:write); a resumed upload sends only the rest
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: "size_bytes, part_size_bytes, part_count and uploaded_parts (part numbers whose size matches the plan)" }
        "404": { description: Object not found or not visible }
        "409": { description: No multipart upload in progress for this object }
        "410": { description: Upload intent or multipart session expired }
        "502": { description: Storage unavailable }
  /api/v1/objects/{oid}/multipart/parts:
    post:
      summary: Short-lived presigned PUTs for up to 100 part numbers (objects:write)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [part_numbers]
              properties:
                part_numbers: { type: array, minItems: 1, maxItems: 100, items: { type: integer, minimum: 1 } }
      responses:
        "200": { description: "One URL per part, each bound to the part's exact Content-Length" }
        "404": { description: Object not found or not visible }
        "409": { description: No multipart upload in progress for this object }
        "410": { description: Upload intent expired }
        "422": { description: Part number out of range }
  /api/v1/objects/{oid}/restore:
    post:
      summary: Restore a soft-deleted object from the trash (objects:delete)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object metadata, status available again }
        "404": { description: Object not found or not visible }
        "409": { description: Object is not in the trash, or was deleted before its upload completed (nothing to restore) }
  /api/v1/objects/{oid}/purge:
    post:
      summary: Permanently delete an object (objects:purge, operator/admin)
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200": { description: Object purged }
        "403": { description: Not authorised }
        "404": { description: Object not found or not visible }
        "502": { description: Storage delete failed; the catalogue reference is kept }
  /api/v1/folders:
    get:
      summary: List folders owned by the caller (objects:read, human only)
      parameters:
        - in: query
          name: parent_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Return the children of this folder; omitted = root level
        - in: query
          name: all
          schema: { type: boolean, default: false }
          description: >-
            When true, return the caller's whole folder tree as a flat list
            (each item still carries parent_id) in a single request. Cannot be
            combined with parent_id (refused with 422).
      responses:
        "200": { description: Folders directly under the requested parent, or the full flat tree when all=true }
        "401": { description: Authentication required }
        "403": { description: Access denied }
        "404": { description: Parent folder not found or not visible }
        "422": { description: all combined with parent_id }
    post:
      summary: Create a logical folder (objects:write, human only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255, description: Flat label; no path separators or control characters }
                parent_id: { $ref: "#/components/schemas/Uuid4", nullable: true, description: Existing folder owned by the caller; omitted/null = root }
      responses:
        "200": { description: Folder created }
        "401": { description: Authentication required }
        "403": { description: Access denied }
        "404": { description: Parent folder not found or not visible }
        "409": { description: Duplicate name at this level, or depth limit reached }
        "422": { description: Invalid folder name }
  /api/v1/folders/{fid}:
    get:
      summary: Get folder metadata (objects:read, human only)
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200": { description: Folder metadata }
        "404": { description: Folder not found or not visible }
    patch:
      summary: Rename or move a folder (objects:write, human only)
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: At least one of name/parent_id; parent_id null moves the folder to the root
              properties:
                name: { type: string, minLength: 1, maxLength: 255, nullable: true }
                parent_id: { $ref: "#/components/schemas/Uuid4", nullable: true }
      responses:
        "200": { description: Folder updated }
        "404": { description: Folder or target parent not found or not visible }
        "409": { description: Duplicate name, cycle, or depth limit reached }
        "422": { description: No fields supplied, or invalid name }
    delete:
      summary: Delete an empty folder (objects:delete, human only)
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200": { description: Folder deleted }
        "404": { description: Folder not found or not visible }
        "409": { description: Folder is not empty }
  /api/v1/admin/reconcile:
    post:
      summary: Expire stale pending uploads (admin:write)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
          description: Bounded sweep, oldest first; repeat until expired is 0 (server clamps to 1..5000)
      responses:
        "200": { description: "Reconcile counts (expired, storage_deletes_attempted, storage_failures); failed storage deletes keep the intent pending" }
        "403": { description: Not authorised }
  /api/v1/admin/stats:
    get:
      summary: Aggregate counts (admin:read)
      responses:
        "200": { description: Counts by status/application/space/identity }
        "403": { description: Not authorised }
  /api/v1/admin/audit:
    get:
      summary: Search the audit log newest-first (admin:read)
      parameters:
        - in: query
          name: since
          schema: { type: integer, minimum: 0 }
          description: Inclusive lower bound on event time (epoch seconds)
        - in: query
          name: until
          schema: { type: integer, minimum: 0 }
          description: Inclusive upper bound on event time (epoch seconds)
        - in: query
          name: actor
          schema: { type: string, maxLength: 200 }
          description: Substring match on the actor (username or identity id)
        - in: query
          name: action
          schema: { type: string, maxLength: 100 }
          description: Exact action name (e.g. login, upload-intent, admin.reconcile)
        - in: query
          name: result
          schema: { type: string, maxLength: 50 }
          description: Exact result (e.g. success, failure, rate_limited)
        - in: query
          name: space_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Events attributed to this space (post-authentication events only)
        - in: query
          name: application_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Events attributed to this application (post-authentication events only)
        - in: query
          name: request_id
          schema: { type: string, maxLength: 128 }
          description: Exact request correlation id (also returned as X-Request-Id)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Server clamps out-of-range values to 1..500 (never 422)
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Negative values are clamped to 0 (never 422)
      responses:
        "200": { description: "Matching events newest-first (items, total in window, truncated flag, scanned lines, retention_days, queried_at)" }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "422": { description: Malformed id, or since exceeding until }
  /api/v1/admin/audit/prune:
    post:
      summary: Drop audit lines older than the retention window (admin:write)
      description: >-
        Enforces AURA_AUDIT_RETENTION_DAYS (default 90). Lines without a valid
        timestamp are kept, so audit data is never deleted silently.
      responses:
        "200": { description: Prune counts (kept, dropped, cutoff, retention_days); a missing log file yields zeros }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "503": { description: Audit log rewrite failed (the file itself is still readable) }
  /api/v1/admin/integrity:
    get:
      summary: Periodic integrity scrub results (admin:read)
      description: >-
        Counts of available objects per scrub result (ok, mismatch, missing,
        unchecked) and the objects at fault. Read-only; nothing is changed
        automatically — a mismatch or missing object calls for a restore.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Problems listed (server clamps to 1..500)
      responses:
        "200": { description: "interval_days, results {result: {count, oldest}}, problems" }
        "403": { description: Not authorised }
  /api/v1/admin/integrity/scrub:
    post:
      summary: Run one bounded scrub pass now (admin:write)
      responses:
        "200": { description: "Counts of this pass: ok, mismatch, missing, error, bytes" }
        "403": { description: Not authorised }
  /api/v1/admin/storage-orphans:
    get:
      summary: Read-only storage bytes the catalogue does not account for (admin:read)
      description: >-
        Keys in registered buckets with no catalogue row (no_row) or whose row is
        aborted/expired/failed (terminal), plus unfinished multipart uploads no
        pending row owns. Soft-deleted objects (trash) are not orphans. Anything
        younger than AURA_ORPHAN_GRACE_SECONDS is ignored. Bounded and resumable.
      parameters:
        - in: query
          name: bucket
          schema: { type: string, maxLength: 63 }
          description: One registered bucket; omitted = all registered buckets
        - in: query
          name: start_after
          schema: { type: string, maxLength: 1024 }
          description: Resume after this key (next_start_after of a previous call)
        - in: query
          name: max_keys
          schema: { type: integer, minimum: 1, maximum: 50000, default: 5000 }
      responses:
        "200": { description: "grace_seconds, buckets[{bucket, scanned, orphans, orphan_bytes, stale_uploads, next_start_after}]" }
        "403": { description: Not authorised }
        "404": { description: Bucket not registered }
  /api/v1/admin/storage-orphans/cleanup:
    post:
      summary: Remove listed orphan keys and abort listed stale uploads (admin:write, destructive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bucket]
              properties:
                bucket: { type: string, maxLength: 63 }
                keys: { type: array, maxItems: 100, items: { type: string } }
                uploads:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [key, upload_id]
                    properties:
                      key: { type: string }
                      upload_id: { type: string }
      responses:
        "200": { description: "removed, aborted_uploads, skipped[{key, reason}] — each item re-checked before acting" }
        "403": { description: Not authorised }
        "404": { description: Bucket not registered }
  /api/v1/admin/orphans:
    get:
      summary: Read-only orphan candidates, available rows missing at storage (admin:read)
      description: >-
        Candidates only — nothing is ever deleted on this signal alone, since a
        transient outage also produces candidates. Bounded scan, oldest first.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
          description: Rows scanned (server clamps to 1..1000)
      responses:
        "200": { description: Checked count, candidate rows and check time }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/usage:
    get:
      summary: Real consumption per space plus configured limits (admin:read)
      description: >-
        Verified bytes count available objects only; measured_at is the live
        query time. No bandwidth or capacity figures exist — see
        docs/OBSERVABILITY.md.
      parameters:
        - in: query
          name: space_id
          schema: { $ref: "#/components/schemas/Uuid4" }
          description: Restrict to one space; omitted = every space plus totals
      responses:
        "200": { description: Limits, totals and per-space usage (bytes are verified available bytes) }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
        "404": { description: Space not found }
        "422": { description: Identifier is not a canonical UUID v4 }
  /api/v1/admin/health:
    get:
      summary: Supervision snapshot for api, database, storage and disk (admin:read)
      description: >-
        Always 200 with per-component ok/down statuses; top-level degraded when
        any dependency fails. The storage check proves S3 reachability, not a
        full upload/download round-trip.
      responses:
        "200": { description: Component statuses, recent non-success audit events, operator notes }
        "401": { description: Authentication required }
        "403": { description: Not authorised }
  /api/v1/admin/applications:
    post:
      summary: Register an application (admin:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
      responses:
        "200": { description: Application created }
        "409": { description: Application already exists }
    get:
      summary: List applications (admin:read)
      responses:
        "200": { description: Applications }
  /api/v1/admin/spaces:
    post:
      summary: Create a space and its default bucket (admin:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id, name, environment]
              properties:
                application_id: { $ref: "#/components/schemas/Uuid4" }
                name: { type: string, minLength: 1, maxLength: 63 }
                environment: { type: string, minLength: 1, maxLength: 32 }
                default_bucket: { type: string, maxLength: 63, nullable: true, description: Must be a valid S3 bucket name; omitted = derived from name and environment (also validated) }
      responses:
        "200": { description: Space created }
        "404": { description: Application not found }
        "409": { description: Duplicate (application_id, name, environment), inactive application, or bucket name already in use }
        "422": { description: Invalid bucket name }
    get:
      summary: List spaces (admin:read)
      responses:
        "200": { description: Spaces }
  /api/v1/admin/identities:
    post:
      summary: Create a machine-to-machine identity (admin:write)
      description: The token is returned exactly once; only its fingerprint is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [space_id, name]
              properties:
                space_id: { $ref: "#/components/schemas/Uuid4" }
                name: { type: string, minLength: 1, maxLength: 63 }
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [objects:read, objects:write, objects:delete, objects:purge]
                ttl_seconds: { type: integer, minimum: 1, nullable: true }
      responses:
        "200": { description: Identity created; response contains the one-time token }
        "404": { description: Space not found }
        "422": { description: Unknown scope, or an admin scope requested for a service identity }
    get:
      summary: List identities without secrets (admin:read)
      parameters:
        - in: query
          name: space_id
          schema: { $ref: "#/components/schemas/Uuid4" }
      responses:
        "200": { description: Identity metadata (never secret material) }
  /api/v1/admin/identities/{iid}/rotate:
    post:
      summary: Rotate an identity secret (admin:write)
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "200": { description: New one-time token; old secret invalid immediately }
        "404": { description: Identity not found or revoked }
  /api/v1/admin/identities/{iid}/revoke:
    post:
      summary: Revoke an identity (admin:write)
      parameters:
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "200": { description: Identity revoked }
        "404": { description: Identity not found }
  /api/v1/admin/applications/{aid}:
    get:
      summary: Application detail with its stable id and space count (admin:read)
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200": { description: Application with name, status, stable id and space count }
        "404": { description: Application not found }
        "422": { description: Identifier is not a canonical UUID v4 }
    patch:
      summary: Rename or activate/deactivate an application (admin:write)
      description: >-
        Soft lifecycle only: an application is never deleted. Deactivating it
        blocks new spaces from being attached while existing ones stay readable.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: Application updated }
        "404": { description: Application not found }
        "409": { description: Application name already exists }
        "422": { description: No field, an explicit null, or an invalid status }
  /api/v1/admin/spaces/{sid}:
    get:
      summary: Space detail with buckets and attachment counts (admin:read)
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200": { description: Space with its application, buckets and counts }
        "404": { description: Space not found }
        "422": { description: Identifier is not a canonical UUID v4 }
    patch:
      summary: Rename, re-environment or activate/deactivate a space (admin:write)
      description: >-
        `application_id` is immutable — a space is never moved to another
        application. `name`/`environment` must stay unique within the
        application. Deactivating a space refuses new uploads and new identities
        while keeping existing rows readable.
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 63 }
                environment: { type: string, minLength: 1, maxLength: 32 }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: Space updated }
        "404": { description: Space not found }
        "409": { description: Duplicate (application_id, name, environment) }
        "422": { description: No field, an explicit null, or an invalid status }
  /api/v1/admin/spaces/{sid}/buckets:
    post:
      summary: Register an additional bucket for a space (admin:write)
      description: >-
        Additive and non-destructive: the bucket is created in the catalogue and
        the S3 name rules are enforced. It is not made the default here and no
        bucket is ever deleted through the API.
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  description: Must be a valid S3 bucket name.
      responses:
        "200": { description: Bucket registered (not the space default) }
        "404": { description: Space not found }
        "409": { description: Bucket name already in use }
        "422": { description: Invalid bucket name }
  /api/v1/admin/buckets:
    get:
      summary: List every bucket with its space/application attachment (admin:read)
      responses:
        "200": { description: Buckets and their attachment; never any S3 credential }
  /api/v1/admin/buckets/{bid}:
    patch:
      summary: Set or clear a bucket's default flag (admin:write)
      description: >-
        Setting a bucket default clears the flag on the other buckets of the
        same space, so exactly one default is possible. Existing objects keep
        their own bucket locator, so the change is reversible.
      parameters:
        - $ref: "#/components/parameters/BucketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_default]
              properties:
                is_default: { type: boolean }
      responses:
        "200": { description: Bucket default flag updated }
        "404": { description: Bucket not found }
        "422": { description: Invalid or missing body field }
components:
  schemas:
    Uuid4:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: >-
        Canonical identifier: a canonical UUID v4 (lowercase, 8-4-4-4-12).
        Alternate spellings are normalized; anything else is refused with 422.
        See docs/DATA-MODEL.md.
  parameters:
    ObjectId:
      in: path
      name: oid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    IdentityId:
      in: path
      name: iid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    FolderId:
      in: path
      name: fid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    ApplicationId:
      in: path
      name: aid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    SpaceId:
      in: path
      name: sid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
    BucketId:
      in: path
      name: bid
      required: true
      schema: { $ref: "#/components/schemas/Uuid4" }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aura_session
      description: HttpOnly human session cookie; mutations also require the X-CSRF-Token header.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "AURA service token (aura_<id>_<secret>)"
